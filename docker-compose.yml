services:
  zhilian-mcp:
    # ECS production must use Dockerfile.ecs (reuses shixiseng-mcp:latest Playwright
    # base). The plain Dockerfile pulls the 2GB official Playwright image and OOMs the
    # 2GB Aliyun box. Local dev can override: ZHILIAN_DOCKERFILE=Dockerfile docker compose up
    build:
      context: .
      dockerfile: ${ZHILIAN_DOCKERFILE:-Dockerfile.ecs}
      # pypi.org stalls from the Aliyun box; export PIP_INDEX_URL to a mirror when building there.
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: zhilian-mcp
    restart: unless-stopped
    ports: ["127.0.0.1:18064:18064"]
    # ECS keeps session/QR outside the source tree. Locally:
    #   ZHILIAN_DATA_DIR=./data docker compose up --build
    volumes: ["${ZHILIAN_DATA_DIR:-/opt/zhilian/data}:/data"]
    shm_size: "256m"
    mem_limit: 700m
